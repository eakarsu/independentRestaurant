name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
          POSTGRES_DB: restaurant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://restaurant:restaurant@127.0.0.1:5432/restaurant_test
      NEXTAUTH_URL: http://127.0.0.1:3000
      TAX_RATE_BPS: "875"
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate ephemeral test secrets
        run: |
          echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_WORKER_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
      - name: Build production image
        run: docker build -t independent-restaurant:${{ github.sha }} .
