services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - restaurant-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://restaurant:${POSTGRES_PASSWORD}@database:5432/restaurant
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://restaurant:${POSTGRES_PASSWORD}@database:5432/restaurant
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      TAX_RATE_BPS: ${TAX_RATE_BPS:?TAX_RATE_BPS is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      FULFILLMENT_PROVIDER_URL: ${FULFILLMENT_PROVIDER_URL:-}
      FULFILLMENT_PROVIDER_TOKEN: ${FULFILLMENT_PROVIDER_TOKEN:-}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?INTERNAL_WORKER_SECRET is required}
      # Customer-facing assistant. Without these the assistant falls back to
      # deterministic answers and reports that no provider was used.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Facts the assistant answers from, and where handoffs are sent.
      RESTAURANT_NAME: ${RESTAURANT_NAME:-}
      RESTAURANT_HOURS: ${RESTAURANT_HOURS:-}
      RESTAURANT_ADDRESS: ${RESTAURANT_ADDRESS:-}
      RESTAURANT_PHONE: ${RESTAURANT_PHONE:-}
      RESTAURANT_STAFF_NOTIFICATION_TARGET: ${RESTAURANT_STAFF_NOTIFICATION_TARGET:-}
      # Optional demo login autofill. Only hosts listed in DEMO_AUTOFILL_HOSTS
      # are served, and only the DEMO_* credentials are returned there.
      ENABLE_DEMO_CREDENTIAL_AUTOFILL: ${ENABLE_DEMO_CREDENTIAL_AUTOFILL:-false}
      DEMO_AUTOFILL_HOSTS: ${DEMO_AUTOFILL_HOSTS:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  restaurant-data:
